[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tynode-api"
version = "0.1.0"
description = "Tynode server: ingest API, query API and dashboard"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "httpx>=0.26", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["tynode_api*"]

[tool.setuptools.package-data]
tynode_api = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100