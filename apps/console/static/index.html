<link rel="stylesheet" href="/static/apple.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.45 var(--text);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
input,button,select,textarea{font-family:inherit;color:inherit}

button{cursor:pointer}
.drag{-webkit-app-region:drag}.nodrag{-webkit-app-region:no-drag}
.screen{position:fixed;inset:0;display:none}.screen.on{display:flex;animation:fade .3s ease-out}

/* auth */

/* shell */
#app{grid-template-columns:240px 1fr}

.sub{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;color:var(--tx2);font-size:12px;cursor:pointer;min-width:0}
.sub:hover{background:var(--seg)}.sub.dim{color:var(--tx3);cursor:default}.sub.dim:hover{background:none}.sub.lnk{color:var(--accent)}.sub .ic{width:13px;height:13px}

.gap{height:10px}

.acct{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;margin-top:8px;box-shadow:var(--shadow)}

.avs{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#1ea7fd,#3b6cff);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ud{color:var(--tx3);display:grid}

#app.col .nav span,#app.col .sec span:first-child,#app.col .sa,#app.col .gk,#app.col .cv,#app.col .gl2 span,#app.col .wsn,#app.col .acct .grow,#app.col .ud,#app.col .nb,#app.col .wsl>.ic{display:none}
#app.col .wsb{flex-direction:column;height:auto;padding:8px 0;gap:6px}
#app.col .nav,#app.col .gl2{justify-content:center}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{height:52px;display:grid;grid-template-columns:1fr minmax(220px,420px) 1fr;align-items:center;padding:0 150px 0 20px;flex:none}

.tools{grid-column:3;justify-self:end;display:flex;align-items:center;gap:6px}
.avst{display:flex;margin-right:6px;cursor:pointer}

.ib{position:relative;width:30px;height:30px;border-radius:9px;border:1px solid transparent;background:none;color:var(--tx2);display:grid;place-items:center}

main{flex:1;overflow:auto;padding:22px 26px 44px;background:var(--page);border-top:1px solid var(--line)}
.fade{animation:fade .25s ease-out}

.pri{height:34px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 13px var(--text);display:inline-flex;align-items:center;gap:7px;transition:filter .15s}

.ghost{border:1px solid var(--line2);background:var(--card);font-size:12px;padding:6px 12px;border-radius:8px}.ghost:hover{border-color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}

.dgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(290px,1fr);gap:16px;align-items:start}

.bn{font:700 34px var(--disp);letter-spacing:-.03em;display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bn.small{font-size:28px}
.bd{font:600 11px var(--text);letter-spacing:0;padding:3px 8px;border-radius:6px;white-space:nowrap}
.bd.good{background:var(--goodbg);color:var(--good)}.bd.bad{background:var(--badbg);color:var(--bad)}.bd.mut{background:var(--seg);color:var(--tx2)}.bd.warn{background:var(--warnbg);color:var(--warn)}
.chart{position:relative;margin-top:10px}.chart svg{width:100%;height:auto;display:block;overflow:visible}

.tag rect{fill:#12151c}[data-theme=dark] .tag rect{fill:#eef1f6}.tag text{fill:#fff;font:600 11px var(--text)}[data-theme=dark] .tag text{fill:#0d121a}
.xp{fill:var(--accentbg,#cfeaff)}.xpt{fill:#0a6fb4;font:600 11px var(--text)}
[data-theme=dark] .xp{fill:#16405c}[data-theme=dark] .xpt{fill:#9ad8ff}
.tip{position:absolute;display:none;transform:translate(-50%,-150%);background:var(--card);color:var(--tx);border:1px solid var(--line2);box-shadow:0 6px 18px rgba(10,14,25,.16);padding:5px 10px;border-radius:8px;font-size:12px;pointer-events:none;white-space:nowrap}

async function submitPw(){const em=$("#em_in").value.trim(),pw=$("#pw_in").value,b=$("#go");$("#aerr").textContent="";
 if(!em||!pw){$("#aerr").textContent="Enter your email and password.";return}
 b.disabled=true;b.textContent=mode=="login"?"Signing in...":"Creating account...";
 try{const r=await fetch("/v1/auth/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$("#aerr").textContent=errText(j,"Enter a valid email and a password with at least 8 characters.");return}

 finally{b.disabled=false;b.textContent=mode=="login"?"Sign in":"Create account"}}
async function submitOtp(){const em=$("#em_in").value.trim(),b=$("#go");$("#aerr").textContent="";
 if(!em){$("#aerr").textContent="Enter your email.";return}
 const code=$("#code_in").value.replace(/\s/g,"");
 if(otpStage==1&&!code){$("#aerr").textContent="Enter the code from your email.";return}
 b.disabled=true;b.textContent=otpStage==0?"Sending...":"Verifying...";
 try{
  if(otpStage==0){
   const r=await fetch(OTPAPI.send,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok){$("#aerr").textContent=errText(j,"Could not send the code. Wait a minute and try again.");return}
   otpStage=1;$("#em_in").disabled=true;$("#code_in").style.display="";$("#otp_back").style.display="";
   $("#ahint").textContent="Code sent to "+em+". Check your spam folder too.";setTimeout(()=>$("#code_in").focus(),50)}
  else{
   const body={email:em};body[OTPAPI.codeField]=code;
   const r=await fetch(OTPAPI.verify,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.token){$("#aerr").textContent=(j.detail?(typeof j.detail==="string"?j.detail:JSON.stringify(j.detail)):errText(j,"Invalid or expired code."));return}

 catch(e){$("#aerr").textContent="Cannot reach the engine. Restart Tynode."}
 finally{b.disabled=false;b.textContent=otpStage==0?"Send code":"Verify code"}}

function rng(){const now=Date.now();if(R.p=="custom"&&R.f&&R.t)return{f:R.f,t:R.t};const n={"24h":1,"7d":7,"30d":30,"90d":90}[R.p]||1;return{f:now-n*DAY,t:now}}
function periods(){const r=rng(),len=Math.max(1,r.t-r.f);return{f:r.f,t:r.t,len:len,cur:T.filter(x=>x.start>=r.f&&x.start<=r.t),prev:T.filter(x=>x.start>=r.f-len&&x.start<r.f)}}
function rangeLabel(){const r=rng();return fmtD(r.f)+" - "+fmtD(r.t)}
function blabel(ts,len){const d=new Date(ts),dd=len/DAY;return dd<=2?d2(d.getHours())+":"+d2(d.getMinutes()):dd<=8?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]:dd<=62?MON[d.getMonth()]+" "+d.getDate():MON[d.getMonth()]}
function bser(P,fn,n){const bms=P.len/n,b=Array.from({length:n},()=>[]);
 P.cur.forEach(t=>{const i=Math.min(n-1,Math.max(0,Math.floor((t.start-P.f)/bms)));b[i].push(t)});
 return{vals:b.map(a=>fn(a)),labels:b.map((_,i)=>blabel(P.f+i*bms,P.len))}}
const bn=len=>{const d=len/DAY;return d<=2?24:d<=62?Math.max(2,Math.ceil(d)):30};

 const r=await Promise.all([get("/v1/traces?limit=500"),get("/v1/stats"),get("/v1/tn/agents").catch(e=>{if(String(e.message)=="401")throw e;return[]})]);

async function openTrace(id){const sp=await get("/v1/traces/"+id);
 const t0=Math.min.apply(null,sp.map(s=>s.start_ms)),tot=Math.max(1,Math.max.apply(null,sp.map(s=>s.start_ms+s.duration_ms))-t0),bad=sp.some(s=>s.status=="error");
 $("#panel").innerHTML='<div class="ph"><b>Trace '+esc(id)+'</b><button class="btn" id="done">Done</button></div><div class="pb">'+
 '<div class="stats"><div class="stat"><span>Duration</span><b>'+ms(tot)+'</b></div><div class="stat"><span>Cost</span><b>'+usd(sum(sp,s=>s.cost))+'</b></div><div class="stat"><span>Status</span><b'+(bad?' class="bad"':"")+'>'+(bad?"Error":"OK")+'</b></div></div>'+
 sp.map(s=>'<div class="wf"><div class="n">'+esc(s.name)+'<div class="mut">'+esc(s.model)+'</div></div><div class="track"><div class="bar2'+(s.status=="error"?" err":"")+'" style="left:'+((s.start_ms-t0)/tot*100)+'%;width:'+Math.max(.8,s.duration_ms/tot*100)+'%"></div></div><div class="val">'+ms(s.duration_ms)+'</div></div>'+(s.error?'<div class="errbox">'+esc(s.error)+'</div>':"")).join("")+'</div>';

 const b=new Blob([rows.map(r=>r.join(",")).join("\r\n")],{type:"text/csv"}),u=URL.createObjectURL(b),l=document.createElement("a");
 l.href=u;l.download="tynode-traces.csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

  '<div class="kpis" style="margin:14px 0 0;grid-template-columns:repeat(2,1fr)"><div class="kpi"><span>Agents</span><b>'+P.usage.agents+" / "+cap(P.limits.agents)+'</b></div><div class="kpi"><span>Retention</span><b>'+P.limits.retention+' days</b></div></div>'+
